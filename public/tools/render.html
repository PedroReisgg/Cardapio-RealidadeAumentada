<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Render de modelos</title>
<script type="importmap">
{ "imports": { "three": "../vendor/three/three.module.min.js", "three/addons/": "../vendor/three/addons/" } }
</script>
<script type="module" src="../vendor/model-viewer.min.js"></script>
<style>
  body { margin: 0; background: #fff; }
  #stage { width: 800px; height: 600px; background: radial-gradient(120% 90% at 50% 30%, #fbf3e6 0%, #efdcc0 60%, #d9bd96 100%); }
  model-viewer { width: 100%; height: 100%; --poster-color: transparent; }
</style>
</head>
<body>
<!-- Página usada só pelo script tools/build-models.mjs para gerar os .glb e as fotos do cardápio. -->
<div id="stage"><model-viewer id="mv" shadow-intensity="1.1" shadow-softness="0.8" exposure="1.05" environment-image="neutral" camera-orbit="25deg 62deg auto" field-of-view="22deg" interaction-prompt="none"></model-viewer></div>
<script type="module">
  import { specToGLBBlob } from '../js/dish3d.js';
  const mv = document.getElementById('mv');
  window.makeGLB = async (spec) => {
    const blob = await specToGLBBlob(spec);
    const bytes = new Uint8Array(await blob.arrayBuffer());
    let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
    return btoa(s);
  };
  window.showModel = (src) => new Promise((res) => {
    mv.addEventListener('load', async () => { await mv.updateComplete; setTimeout(res, 600); }, { once: true });
    mv.src = src + '?t=' + Date.now();
  });
  window.ready = true;
</script>
</body>
</html>
